name: REACH 2.2 offline shell native regression

on:
  push:
    branches:
      - experiment/gohyperlevel-synthetic-poc-20261104
    paths:
      - 'reach-shell/**'
      - 'reach-staging/**'
      - 'ghl-gpt-gateway/public/reach-demo/index.html'
      - '.github/workflows/reach-2-2-shell-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reach-2-2-shell-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-node-shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout staging only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify shell and preview are byte identical
        run: cmp reach-shell/index.html ghl-gpt-gateway/public/reach-demo/index.html
      - name: Native Node regression suite
        run: node --test reach-shell/*.test.cjs
      - name: Native staging auth unit tests
        run: node --test reach-staging/auth/*.test.cjs
      - name: Check inline application JavaScript syntax
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('reach-shell/index.html', 'utf8');
          const script = html.match(/<script>([\s\S]*?)<\/script>/)?.[1];
          if (!script) throw Error('Missing inline shell script');
          new vm.Script(script, {filename: 'reach-shell/index.html'});
          console.log('Inline JavaScript syntax PASS');
          NODE
