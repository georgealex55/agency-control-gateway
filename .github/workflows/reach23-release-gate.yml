name: REACH 2.3 production release gate
on:
  push:
    branches:
      - release/reach23-owner-login-connections-20261117
      - test/reach-owner-session-http-20261119
      - main
      - fix/reach-social-connect-buttons-20261119
      - fix/reach-instagram-app-id-diagnostics-20261119
      - feature/reach-instagram-unified-login-20261122
      - feature/reach-connections-3-foundation-20261123
      - feature/reach-youtube-tiktok-readonly
      - feature/reach-connections-traffic-lights-20261124
      - release/reach-connections-31-production-20261124
      - feature/reach-managed-social-onboarding-20261122
      - feature/reach-23-meta-app-onboarding-20261119
      - feature/reach-23-meta-owner-staging-20261120
      - feature/reach-23-persistent-neon-vault-20261120
      - feature/reach-neon-owner-session-connect-20261119
      - feature/reach-23-neon-customer-preview-20261119
      - fix/reach-owner-login-config-diagnostics-20261119
      - fix/reach-owner-login-origin-diagnostics-20261119
    paths:
      - 'ghl-gpt-gateway/**'
      - 'tests/reach-*.test.mjs'
      - 'tests/reach-owner-session-http.mjs'
      - 'reach-shell/index.html'
      - '.github/workflows/reach23-release-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify standalone shell mirrors
        run: cmp reach-shell/index.html ghl-gpt-gateway/public/reach-demo/index.html
      - name: Install locked application dependencies without scripts
        working-directory: ghl-gpt-gateway
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test owner login and production connection security
        run: node --test tests/reach-owner-connections.test.mjs tests/reach-23-ui-contract.test.mjs tests/reach-command-center.test.mjs tests/reach-command-runtime.test.mjs tests/reach-owner-origin.test.mjs tests/reach-owner-config.test.mjs tests/reach-neon-customer-config.test.mjs tests/reach-neon-live-session.test.mjs tests/reach-neon-vault.test.mjs tests/reach-social-owner-storage.test.mjs tests/reach-social-readiness.test.mjs tests/reach-meta-app-vault.test.mjs tests/reach-connections-3-foundation.test.mjs tests/reach-connections-traffic-lights.test.mjs tests/reach-video-oauth.test.mjs
      - name: Typecheck Next.js REACH app
        working-directory: ghl-gpt-gateway
        run: npx tsc --noEmit
      - name: Build Next.js without production credentials
        working-directory: ghl-gpt-gateway
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
      - name: Verify owner login over real localhost HTTP with fictional credentials
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: node tests/reach-owner-session-http.mjs
