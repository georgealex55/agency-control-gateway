name: REACH CRM security and workflow recovery staging

on:
  push:
    branches:
      - experiment/gohyperlevel-synthetic-poc-20261104
    paths:
      - .github/workflows/reach-security-stage.yml
      - audit/gohyperlevel/reach-security.test.ts
      - audit/gohyperlevel/patches/**
      - scripts/reach-security-patch.mjs
      - docs/audits/reach-security-stage-2026-11-04.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reach-security-stage
  cancel-in-progress: true

jobs:
  security-recovery:
    name: Original forecast regression + bound keys + MCP + recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout REACH experiment only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: false

      - name: Checkout pinned GoHyperLevel source into disposable CI checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: BAISESYSTEMS/GoHyperLevel
          ref: 24ea786b85c3240ae4f24dcad6f657749730c56e
          path: _upstream/gohyperlevel
          persist-credentials: false
          submodules: false

      - name: Verify immutable upstream SHA
        working-directory: _upstream/gohyperlevel
        run: test "$(git rev-parse HEAD)" = "24ea786b85c3240ae4f24dcad6f657749730c56e"

      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install pinned dependency tree
        working-directory: _upstream/gohyperlevel
        run: npm ci --no-audit --no-fund

      - name: Apply REACH isolated security overlay if present
        run: |
          if test -f scripts/reach-security-patch.mjs; then
            node scripts/reach-security-patch.mjs _upstream/gohyperlevel
          else
            echo "Baseline unpatched upstream — intentional security reproduction"
          fi

      - name: Copy synthetic security fixture into disposable upstream checkout
        run: cp audit/gohyperlevel/reach-security.test.ts _upstream/gohyperlevel/tests/reach-security.test.ts

      - name: Run original restricted forecast test and REACH security recovery suite
        working-directory: _upstream/gohyperlevel
        run: npx vitest run tests/sec-w10-crm-access.test.ts tests/reach-security.test.ts --reporter=verbose
        timeout-minutes: 12

      - name: Re-run focused preexisting API user-key and workflow retry tests
        working-directory: _upstream/gohyperlevel
        run: npx vitest run tests/api-key-user.test.ts tests/workflow-errors.test.ts --reporter=verbose
        timeout-minutes: 12

      - name: Verify full TypeScript type safety
        working-directory: _upstream/gohyperlevel
        run: npm run typecheck
