name: Agency milestone policy tests
on:
  push:
    branches:
      - feature/agency-milestone1-home-20261029
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  agency-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: node --experimental-strip-types --test tests/agency-contracts.test.mjs tests/platform-core.test.mjs
