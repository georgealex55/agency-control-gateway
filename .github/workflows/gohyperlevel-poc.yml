name: GoHyperLevel pinned proof-of-concept audit
on:
  push:
    branches:
      - feature/agency-five-seats-stage-20261029
    paths:
      - .github/workflows/gohyperlevel-poc.yml
      - audit/gohyperlevel/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gohyperlevel-poc-staging
  cancel-in-progress: true

env:
  GOHYPERLEVEL_SHA: 24ea786b85c3240ae4f24dcad6f657749730c56e
  CI: "true"

jobs:
  source-validation:
    name: Pinned source typecheck, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: false
      - name: Fetch exact original source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: BAISESYSTEMS/GoHyperLevel
          ref: 24ea786b85c3240ae4f24dcad6f657749730c56e
          path: poc-source
          persist-credentials: false
      - name: Assert immutable source
        run: test "$(git -C poc-source rev-parse HEAD)" = "$GOHYPERLEVEL_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install upstream dependencies
        working-directory: poc-source
        run: npm ci --no-audit --no-fund
        timeout-minutes: 8
      - name: Typecheck original upstream
        working-directory: poc-source
        run: npm run typecheck
        timeout-minutes: 8
      - name: Run upstream synthetic test suite
        working-directory: poc-source
        run: npm test
        timeout-minutes: 20
      - name: Build original production app
        working-directory: poc-source
        run: npm run build
        timeout-minutes: 12

  docker-ui-audit:
    name: Synthetic Docker app and real browser screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: false
      - name: Fetch exact original source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: BAISESYSTEMS/GoHyperLevel
          ref: 24ea786b85c3240ae4f24dcad6f657749730c56e
          path: poc-source
          persist-credentials: false
      - name: Assert immutable source
        run: test "$(git -C poc-source rev-parse HEAD)" = "$GOHYPERLEVEL_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Build upstream Docker image locally, never push
        run: docker build --tag gohyperlevel-audit:local ./poc-source
        timeout-minutes: 25
      - name: Install isolated browser driver
        run: npm install --prefix "$RUNNER_TEMP/goh-visual" --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
        timeout-minutes: 5
      - name: Boot synthetic app and capture UI evidence
        env:
          PGHL_ADMIN_EMAIL: audit-only@example.invalid
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/goh-synthetic-data" "$RUNNER_TEMP/goh-evidence"
          export PGHL_ADMIN_PASSWORD="$(openssl rand -hex 20)"
          docker run --detach --name gohyperlevel-qa --network host \
            --volume "$RUNNER_TEMP/goh-synthetic-data:/data" \
            --env PGHL_DATA_DIR=/data \
            --env PGHL_BASE_URL=http://127.0.0.1:4700 \
            --env PGHL_ADMIN_EMAIL="$PGHL_ADMIN_EMAIL" \
            --env PGHL_ADMIN_PASSWORD="$PGHL_ADMIN_PASSWORD" \
            --env PGHL_COMPANY_NAME="Synthetic Audit Workspace" \
            --env PGHL_DEMO_MODE=0 \
            gohyperlevel-audit:local
          ready=0
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4700/healthz >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs --tail 80 gohyperlevel-qa
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:4700/api/version \
            | node --input-type=module -e 'let raw="";for await(const x of process.stdin)raw+=x;const v=JSON.parse(raw);if(v.name!=="HyperLevel")throw Error("Unexpected app");console.log("HyperLevel API version verified")'
          node audit/gohyperlevel/visual-smoke.mjs
          echo "## Isolated GoHyperLevel proof of concept" >> "$GITHUB_STEP_SUMMARY"
          echo "- Immutable upstream commit: $GOHYPERLEVEL_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Original Docker image built and app booted using temporary synthetic SQLite data" >> "$GITHUB_STEP_SUMMARY"
          echo "- Browser screenshots and route/console audit uploaded as a GitHub Actions artifact" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload sanitized UI evidence, never database or passwords
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gohyperlevel-pinned-ui-audit
          path: ${{ runner.temp }}/goh-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Destroy synthetic app and credentials
        if: always()
        run: |
          docker rm --force gohyperlevel-qa 2>/dev/null || true
          sudo rm -rf "$RUNNER_TEMP/goh-synthetic-data"
          rm -rf "$RUNNER_TEMP/goh-visual"
