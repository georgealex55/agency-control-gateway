name: REACH GoHyperLevel functional staging POC

on:
  push:
    branches:
      - experiment/gohyperlevel-synthetic-poc-20261104
    paths:
      - .github/workflows/gohyperlevel-poc.yml
      - scripts/gohyperlevel-poc-smoke.mjs
      - scripts/reach-security-patch.mjs
      - audit/gohyperlevel/**
      - docs/gohyperlevel-runtime-poc.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reach-pghl-synthetic-poc
  cancel-in-progress: true

jobs:
  upstream-functional:
    name: Pinned upstream + functional tests + real browser editor
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout REACH experimental branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: false

      - name: Checkout pinned upstream unmodified
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: BAISESYSTEMS/GoHyperLevel
          ref: 24ea786b85c3240ae4f24dcad6f657749730c56e
          path: _upstream/gohyperlevel
          persist-credentials: false
          submodules: false

      - name: Verify immutable upstream revision
        working-directory: _upstream/gohyperlevel
        run: test "$(git rev-parse HEAD)" = "24ea786b85c3240ae4f24dcad6f657749730c56e"

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install exact upstream dependencies
        working-directory: _upstream/gohyperlevel
        run: npm ci --no-audit --no-fund

      - name: Apply verified REACH member-bound key security patch to disposable source
        run: node scripts/reach-security-patch.mjs _upstream/gohyperlevel

      - name: Typecheck server, web and scripts
        working-directory: _upstream/gohyperlevel
        run: npm run typecheck

      - name: Run original upstream API integration baseline
        working-directory: _upstream/gohyperlevel
        run: npx vitest run tests/api.test.ts

      - name: Inject QA test into throwaway upstream checkout
        run: |
          cp audit/gohyperlevel/reach-functional.test.ts _upstream/gohyperlevel/tests/reach-functional.test.ts
          cp audit/gohyperlevel/reach-security.test.ts _upstream/gohyperlevel/tests/reach-security.test.ts

      - name: Run REACH funnel, LMS, workflow, and tenant-isolation gates
        working-directory: _upstream/gohyperlevel
        run: npx vitest run tests/reach-functional.test.ts tests/reach-security.test.ts --reporter=verbose
        timeout-minutes: 15

      - name: Build original upstream UI and server
        working-directory: _upstream/gohyperlevel
        run: npm run build

      - name: Verify distributed dependency licenses
        working-directory: _upstream/gohyperlevel
        run: npm run licenses

      - name: Verify isolated runtime and SQLite persistence after restart
        run: node scripts/gohyperlevel-poc-smoke.mjs _upstream/gohyperlevel

      - name: Install browser driver on isolated runner
        run: npm install --prefix "$RUNNER_TEMP/reach-browser" --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.56.1

      - name: Exercise real funnel editor, live preview, save and mobile view
        run: node audit/gohyperlevel/reach-editor-browser.mjs _upstream/gohyperlevel
        timeout-minutes: 8

      - name: Upload sanitized screenshots and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reach-funnel-editor-functional-evidence
          path: ${{ runner.temp }}/reach-editor-evidence/
          if-no-files-found: warn
          retention-days: 14
