name: REACH synthetic transactional outbox and lost-ACK reconciliation

on:
  push:
    branches:
      - experiment/gohyperlevel-synthetic-poc-20261104
    paths:
      - .github/workflows/reach-synthetic-outbox.yml
      - audit/gohyperlevel/reach-synthetic-outbox.ts
      - audit/gohyperlevel/reach-fake-provider-worker.mjs
      - audit/gohyperlevel/reach-outbox-fixture.mjs
      - scripts/reach-synthetic-outbox-patch.mjs
      - scripts/reach-synthetic-outbox-ci.mjs
      - scripts/reach-workflow-fault-injection-patch.mjs
      - scripts/reach-workflow-idempotency-patch.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reach-synthetic-outbox-test
  cancel-in-progress: true

jobs:
  synthetic-reconciliation:
    name: Email, SMS, webhook, Postiz lost ACK and app crash
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - name: Checkout isolated REACH experiment
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: false
      - name: Checkout immutable upstream candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: BAISESYSTEMS/GoHyperLevel
          ref: 24ea786b85c3240ae4f24dcad6f657749730c56e
          path: _upstream/gohyperlevel
          persist-credentials: false
          submodules: false
      - name: Verify pinned original revision
        working-directory: _upstream/gohyperlevel
        run: test "$(git rev-parse HEAD)" = "24ea786b85c3240ae4f24dcad6f657749730c56e"
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install synthetic-only external-action outbox and fault hooks
        run: |
          node scripts/reach-security-patch.mjs _upstream/gohyperlevel
          node scripts/reach-workflow-idempotency-patch.mjs _upstream/gohyperlevel
          node scripts/reach-workflow-fault-injection-patch.mjs _upstream/gohyperlevel
          cp audit/gohyperlevel/reach-synthetic-outbox.ts _upstream/gohyperlevel/server/services/reach-synthetic-outbox.ts
          node scripts/reach-synthetic-outbox-patch.mjs _upstream/gohyperlevel
      - name: Check TypeScript compilation and synthetic delivery barrier
        working-directory: _upstream/gohyperlevel
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
      - name: Check Docker engine
        run: docker version --format 'Docker {{.Server.Version}}'
      - name: Run independent fake provider and true service crash matrix
        run: node scripts/reach-synthetic-outbox-ci.mjs _upstream/gohyperlevel
        timeout-minutes: 24
      - name: Upload evidence only (never customer data or credentials)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reach-synthetic-outbox-reconciliation-evidence
          path: ${{ runner.temp }}/reach-outbox-evidence/
          retention-days: 14
          if-no-files-found: warn
