<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REACH 2.0 | Developer Demo</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#e9eaf8;background:#0b1024}*{box-sizing:border-box}body{margin:0}button,a{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:#6356db;color:white}button:focus-visible,a:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #9dbbff;outline-offset:3px}a{color:inherit;text-decoration:none}.layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{padding:24px 14px;background:#10172e;border-right:1px solid #2a3351}.brand{font-size:24px;font-weight:800;letter-spacing:2px;margin:5px 10px 22px}.brand span{color:#9d8fff}.side a{display:block;padding:11px 13px;margin:4px 0;border-radius:9px;color:#bfc7e1}.side a[aria-current=page]{background:#272f60;color:#fff}.main{padding:28px;max-width:1250px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.pill{font-size:12px;color:#e1d6ff;background:#3b2d6c;border-radius:99px;padding:6px 11px}.muted{color:#9ca8c7}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:24px}.card{background:#151e38;border:1px solid #303957;border-radius:16px;padding:20px}.card h3{margin:0 0 10px}.card strong{font-size:26px}.card p{color:#b2bdd7}.wide{grid-column:span 2}.alert{border-left:4px solid #e5a64d}.good{color:#7de4b4}.footer{margin-top:28px;color:#8e9aba;font-size:12px}.menu{display:none}.login{max-width:440px;margin:12vh auto;padding:30px;background:#151e38;border:1px solid #303957;border-radius:18px}.login h1{font-size:30px}input{width:100%;background:#0d152c;border:1px solid #3c4564;border-radius:9px;padding:12px;color:white;margin:10px 0 16px}.placeholder{min-height:170px}textarea,select{background:#0d152c;border:1px solid #3c4564;border-radius:9px;padding:11px;color:white;max-width:100%}textarea{width:100%;resize:vertical}.card button[aria-pressed="true"]{background:#4237a1}.dashboard-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px}.dashboard-controls select{background:#0d152c;border:1px solid #3c4564;border-radius:9px;padding:10px;color:#fff}.metric-button{display:block;background:transparent;color:#b6c8ff;padding:5px 0;text-align:left;text-decoration:underline}.detail{margin-top:18px;border-color:#7569df}.detail h3{color:#dcd6ff}.status{font-size:13px;color:#f5ca88}#navToggle{background:#27335d} @media(max-width:800px){.layout{display:block}.side{display:none;position:absolute;z-index:2;left:0;top:62px;width:250px;box-shadow:8px 8px 40px #0008}.side.open{display:block}.main{padding:18px}.menu{display:block}.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><div id="app"></div>
<script>
'use strict';
const pages=[['dashboard','Dashboard'],['inbox','Inbox'],['calls','Calls'],['appointments','Appointments'],['presence','Business Presence'],['contacts','Contacts'],['automations','Automations'],['metrics','Reports & Metrics'],['assistant','AI Assistant'],['connections','Settings / Connections'],['setup','Help & Setup']];
const seed={business:'Demo Business',tasks:[{id:1,text:'Review missed calls',done:false},{id:2,text:'Verify Google profile hours',done:false}],range:'7 days',detail:null,inboxFilter:'all',inboxSearch:'',selectedConversation:'conv-1',conversations:[
{id:'conv-1',name:'Jordan Lee',channel:'SMS',unread:true,messages:[{direction:'in',text:'Are you open on Saturday?',at:'09:15',status:'received'}],draft:''},
{id:'conv-2',name:'Morgan Chen',channel:'Email',unread:false,messages:[{direction:'in',text:'Can I schedule a consultation?',at:'Yesterday',status:'received'}],draft:''},
{id:'conv-3',name:'Taylor Brooks',channel:'Website chat',unread:true,messages:[{direction:'in',text:'What services do you offer?',at:'Monday',status:'received'}],draft:''}
]};
function read(){try{const v=JSON.parse(localStorage.getItem('reach-demo-state'));return v&&typeof v==='object'?{...seed,...v}:structuredClone(seed)}catch{return structuredClone(seed)}}
let state=read(),logged=sessionStorage.getItem('reach-demo-login')==='yes',open=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem('reach-demo-state',JSON.stringify(state))}
function inboxData(){if(!Array.isArray(state.conversations))state.conversations=structuredClone(seed.conversations);return state.conversations}
function inboxContent(){
 const list=inboxData(),query=(state.inboxSearch||'').toLowerCase(),filter=state.inboxFilter||'all';
 const visible=list.filter(c=>(filter==='all'||(filter==='unread'&&c.unread)||filter===c.channel)&&[c.name,c.channel,...c.messages.map(m=>m.text)].join(' ').toLowerCase().includes(query));
 const selected=list.find(c=>c.id===state.selectedConversation)||null;
 return '<div class="card"><h3>Unified Inbox · Sample conversations</h3><p class="muted">All messages are local demo records. Nothing is connected or delivered.</p><label for="inboxSearch">Search conversations</label><input id="inboxSearch" value="'+esc(state.inboxSearch||'')+'" placeholder="Name or message" aria-label="Search conversations"><label for="inboxFilter">Filter</label><select id="inboxFilter"><option value="all">All channels</option><option value="unread" '+(filter==='unread'?'selected':'')+'>Unread</option>'+['SMS','Email','Website chat'].map(c=>'<option value="'+c+'" '+(filter===c?'selected':'')+'>'+c+'</option>').join('')+'</select></div><div class="grid">'+card('Conversations',visible.length?visible.map(c=>'<p><button data-conversation="'+esc(c.id)+'" aria-pressed="'+(c.id===state.selectedConversation)+'">'+esc(c.name)+'</button> <span class="muted">'+esc(c.channel)+(c.unread?' · Unread':'')+'</span></p>').join(''):'<p>No matching sample conversations.</p>')+card('Conversation',selected?'<h3>'+esc(selected.name)+' · '+esc(selected.channel)+'</h3><p class="muted">Demo only · no provider connected</p>'+selected.messages.map(m=>'<p><strong>'+esc(m.direction==='out'?'Demo reply':'Incoming sample')+'</strong> · '+esc(m.at)+' · '+esc(m.status)+'<br>'+esc(m.text)+'</p>').join('')+'<label for="replyDraft">Reply draft</label><textarea id="replyDraft" rows="4" maxlength="2000" placeholder="Write a sample reply">'+esc(selected.draft||'')+'</textarea><p><button id="saveDraft">Save draft</button> <button id="simulateReply">Simulate reply (not sent)</button></p><p class="status" id="inboxFeedback">Saved locally; no real messages sent.</p>':'<p>Select a sample conversation.</p>','wide')+'</div>';
}
function current(){const key=location.hash.replace(/^#\/?/,'').split('/')[0];return pages.some(p=>p[0]===key)?key:'dashboard'}
function card(title,body,extra=''){return '<section class="card '+extra+'"><h3>'+title+'</h3>'+body+'</section>'}
function render(){
 const root=document.getElementById('app');
 if(!logged){open=false;root.innerHTML='<div class="login"><div class="brand">RE<span>ACH</span></div><span class="pill">LOCAL DEMO · NO REAL AUTH</span><h1>Your business, in focus.</h1><p class="muted">Explore an offline business command center with sample data. No external accounts or messages are connected.</p><label for="business">Demo business name</label><input id="business" maxlength="80" value="'+esc(state.business)+'"><button id="enter">Enter demo dashboard</button></div>';document.getElementById('business').onkeydown=e=>{if(e.key==='Enter')document.getElementById('enter').click()};document.getElementById('enter').onclick=()=>{state.business=document.getElementById('business').value.trim()||seed.business;save();logged=true;sessionStorage.setItem('reach-demo-login','yes');location.hash='#/dashboard';render()};return}
 const key=current(),name=pages.find(p=>p[0]===key)[1];
 root.innerHTML='<div class="layout"><nav class="side '+(open?'open':'')+'" id="sidebar" aria-label="Main navigation"><div class="brand">RE<span>ACH</span></div>'+pages.map(([id,label])=>'<a href="#/'+id+'" '+(key===id?'aria-current="page"':'')+'>'+esc(label)+'</a>').join('')+'<button id="logout">Exit demo</button></nav><main class="main"><div class="top"><div><button class="menu" id="navToggle" aria-expanded="'+open+'" aria-controls="sidebar" aria-label="Toggle navigation menu">☰ Menu</button><p class="muted">REACH 2.0 / '+esc(name)+'</p><h1>'+esc(name)+'</h1><p class="muted">'+esc(state.business)+' · Owner workspace</p></div><span class="pill">DEMO DATA · OFFLINE</span></div><div id="content">'+content(key)+'</div><div class="footer">Staging shell · Simulated records only · External integrations are not connected</div></main></div>';
 document.getElementById('logout').onclick=()=>{logged=false;sessionStorage.removeItem('reach-demo-login');render()};
 const toggle=document.getElementById('navToggle');if(toggle)toggle.onclick=()=>{open=!open;render();const next=document.getElementById('navToggle');if(next)next.focus()};
 document.onkeydown=e=>{if(e.key==='Escape'&&open){open=false;render();document.getElementById('navToggle')?.focus()}};
 bind(key);
}
function content(key){
 if(key==='inbox')return inboxContent();
 if(key==='dashboard'){
 const samples={'7 days':{calls:12,missed:2,inbox:4,website:2,healthy:3,trend:[6,9,12]},'30 days':{calls:49,missed:8,inbox:15,website:2,healthy:3,trend:[31,40,49]},'90 days':{calls:144,missed:23,inbox:41,website:2,healthy:3,trend:[103,127,144]}};
 const period=samples[state.range]||samples['7 days'];
 const details={health:{title:'Business health',text:'Synthetic checks: website online, contact details verified, inbox available; Google profile hours need review.'},calls:{title:'Calls overview',text:period.calls+' simulated calls, including '+period.missed+' missed calls in the selected period. No phone provider connected.'},inbox:{title:'Inbox overview',text:period.inbox+' simulated messages awaiting review. No messages were received or sent.'},presence:{title:'Website and Google',text:'2 sample sources shown. Google profile hours require manual verification; no live provider connection.'}};
 const detail=state.detail&&details[state.detail]?card(details[state.detail].title,'<p>'+esc(details[state.detail].text)+'</p><button id="closeDetail">Close details</button>','wide detail'):'';
 return '<div class="dashboard-controls"><label for="dashboardRange">Sample reporting period</label><select id="dashboardRange"><option value="7 days" '+(state.range==='7 days'?'selected':'')+'>Last 7 days</option><option value="30 days" '+(state.range==='30 days'?'selected':'')+'>Last 30 days</option><option value="90 days" '+(state.range==='90 days'?'selected':'')+'>Last 90 days</option></select><span class="muted">Synthetic period comparison: '+period.trend.join(' → ')+' calls</span></div><div class="grid">'+card('Business Health','<strong class="good">Good</strong><p>Sample operational status · '+period.healthy+' of 4 checks healthy</p><button class="metric-button" data-detail="health">View health checks</button>')+card('Calls','<strong>'+period.calls+'</strong><p>Sample calls · '+period.missed+' missed</p><button class="metric-button" data-detail="calls">View call breakdown</button>')+card('Inbox','<strong>'+period.inbox+'</strong><p>Sample messages awaiting review</p><button class="metric-button" data-detail="inbox">View inbox details</button>')+card('Website & Google','<strong>'+period.website+'</strong><p>Sample presence sources monitored</p><button class="metric-button" data-detail="presence">View presence checks</button>')+card('Priority Actions','<div id="tasks">'+state.tasks.map(t=>'<p><button data-task="'+t.id+'">'+(t.done?'Reopen':'Resolve')+'</button> '+esc(t.text)+' '+(t.done?'✓':'')+'</p>').join('')+'</div>','wide alert')+card('Assistant','<p>Demo assistant not connected to an AI provider.</p><a href="#/assistant">Open assistant →</a>')+detail+'</div>';
 }
 return '<div class="grid">'+card(nameFor(key)+' · Preview','<p>This is a navigable staging screen. Interactive features will be added in subsequent runs.</p><p class="status">Not connected to external services</p>','wide placeholder')+card('Next step','<p>Continue the 12-run build to activate local demo workflows.</p>')+'</div>';
}
function nameFor(key){return pages.find(p=>p[0]===key)?.[1]||'Dashboard'}
function bind(key){
 if(key==='inbox'){
  const search=document.getElementById('inboxSearch');if(search)search.oninput=()=>{state.inboxSearch=search.value;save();render();const next=document.getElementById('inboxSearch');next?.focus()};
  const filter=document.getElementById('inboxFilter');if(filter)filter.onchange=()=>{state.inboxFilter=filter.value;save();render()};
  document.querySelectorAll('[data-conversation]').forEach(b=>b.onclick=()=>{const c=inboxData().find(c=>c.id===b.dataset.conversation);if(c){state.selectedConversation=c.id;c.unread=false;save();render()}});
  const draft=document.getElementById('replyDraft');
  const saveDraft=document.getElementById('saveDraft');if(saveDraft)saveDraft.onclick=()=>{const c=inboxData().find(c=>c.id===state.selectedConversation);if(c){c.draft=draft.value;save();render()}};
  const simulate=document.getElementById('simulateReply');if(simulate)simulate.onclick=()=>{const c=inboxData().find(c=>c.id===state.selectedConversation);const message=draft.value.trim();if(c&&message){c.messages.push({direction:'out',text:message,at:'Demo now',status:'simulated · not delivered'});c.draft='';save();render()}};
 }
 if(key==='dashboard'){
 const range=document.getElementById('dashboardRange');if(range)range.onchange=()=>{if(['7 days','30 days','90 days'].includes(range.value)){state.range=range.value;save();render()}};
 document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>{state.detail=b.dataset.detail;save();render()});
 const close=document.getElementById('closeDetail');if(close)close.onclick=()=>{state.detail=null;save();render()};
 document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{const task=state.tasks.find(t=>t.id===Number(b.dataset.task));if(task){task.done=!task.done;save();render()}});
 }}
window.addEventListener('hashchange',()=>{open=false;render()});render();
</script></body></html>
